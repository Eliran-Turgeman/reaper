- id: information-leakage-obvious-go
  language: Go
  task: Expose the current shopping cart.
  code: |
    type Cart struct {
        ItemsBySKU map[string]*cartEntry
        DirtySlots []int
    }
  expected: positive
  rationale: Consumers become coupled to the cart's indexing and dirty-tracking representation rather than a stable cart contract.
- id: information-leakage-obvious-python
  language: Python
  task: Return the authenticated session.
  code: |
    def current_session(request):
        return {
            "redis_key": request.session._key,
            "redis_ttl": request.session._ttl,
            "payload_blob": request.session._encoded,
        }
  expected: positive
  rationale: The API exposes Redis keys, TTLs, and encoded storage data instead of session meaning.
- id: information-leakage-obvious-typescript
  language: TypeScript
  task: Add a public result for customer lookup.
  code: |
    export interface CustomerLookupResult {
      row: unknown[];
      columnIndexes: { id: 0; email: 3; status: 7 };
      shardNumber: number;
    }
  expected: positive
  rationale: The public result reveals database row layout and sharding decisions that clients must understand.
- id: information-leakage-obvious-csharp
  language: C#
  task: Expose document metadata to callers.
  code: |
    public sealed record DocumentMetadata(
        string S3Bucket,
        string S3ObjectKey,
        string MultipartUploadId,
        string ETag);
  expected: positive
  rationale: Storage-provider concepts are made part of the document module's consumer-facing model.
- id: information-leakage-obvious-java
  language: Java
  task: Report whether an account exists.
  code: |
    record AccountProbe(
        boolean found,
        String tableName,
        long databaseRowId,
        int replicaIndex) {}
  expected: positive
  rationale: A simple account fact unnecessarily exposes table, row, and replica implementation knowledge.
- id: information-leakage-subtle-go
  language: Go
  task: Add an iterator over messages.
  code: |
    type MessageIterator interface {
        Next() bool
        Value() Message
        CurrentSegment() int
        SegmentOffset() int64
    }
  expected: positive
  rationale: Segment and offset accessors bind consumers to the iterator's current log-storage design.
- id: information-leakage-subtle-python
  language: Python
  task: Return a user's permissions.
  code: |
    @dataclass
    class Permissions:
        allowed: set[str]
        role_graph_nodes: dict[str, list[str]]
        expansion_generation: int
  expected: positive
  rationale: Role-graph expansion internals accompany the useful permission set and invite dependencies on the authorization algorithm.
- id: information-leakage-subtle-typescript
  language: TypeScript
  task: Expose an image resizing operation.
  code: |
    export function resize(
      image: Image,
      width: number,
      height: number,
      wasmHeapPages: number,
      tileBufferBytes: number,
    ): Promise<Image>;
  expected: positive
  rationale: Callers must know WebAssembly memory and tiling choices unrelated to the resizing contract.
- id: information-leakage-subtle-csharp
  language: C#
  task: Add a public exception for unavailable reports.
  code: |
    public sealed class ReportUnavailableException : Exception
    {
        public int SqlErrorNumber { get; }
        public string StoredProcedure { get; }
        public int RetryAfterReplicaPolls { get; }
    }
  expected: positive
  rationale: The exception publishes SQL and replication mechanics rather than a stable report-domain failure.
- id: information-leakage-subtle-java
  language: Java
  task: Return the progress of a video conversion.
  code: |
    record ConversionProgress(
        int percent,
        int ffmpegProcessId,
        String temporaryDirectory,
        int completedPipeReads) {}
  expected: positive
  rationale: Process, temporary-directory, and pipe details leak the current converter implementation.
- id: information-leakage-negative-obvious-go
  language: Go
  task: Publish the wire contract for a versioned webhook.
  code: |
    type InvoicePaidWebhook struct {
        Version   string    `json:"version"`
        InvoiceID string    `json:"invoice_id"`
        PaidAt    time.Time `json:"paid_at"`
    }
  expected: negative
  rationale: This representation is the intentional external protocol contract, not hidden module internals.
- id: information-leakage-negative-obvious-python
  language: Python
  task: Let callers inspect validation failures by field.
  code: |
    @dataclass(frozen=True)
    class ValidationError:
        field: str
        code: str
        message: str
  expected: negative
  rationale: Field and stable error code are meaningful public validation information required by clients.
- id: information-leakage-negative-obvious-typescript
  language: TypeScript
  task: Return pagination metadata from the public search API.
  code: |
    export interface SearchPage<T> {
      items: T[];
      nextCursor?: string;
      total: number;
    }
  expected: negative
  rationale: Pagination metadata is part of the API's supported navigation contract and hides cursor contents.
- id: information-leakage-negative-obvious-csharp
  language: C#
  task: Expose an immutable money value to consumers.
  code: |
    public readonly record struct Money(decimal Amount, string Currency);
  expected: negative
  rationale: Amount and currency are essential domain information, not accidental implementation representation.
- id: information-leakage-negative-obvious-java
  language: Java
  task: Expose HTTP cache controls from an HTTP client library.
  code: |
    record CachePolicy(Duration maxAge, boolean mustRevalidate) {}
  expected: negative
  rationale: Cache semantics are an intentional part of the HTTP abstraction's public contract.
- id: information-leakage-negative-difficult-go
  language: Go
  code: |
    type FileInfo interface {
        Name() string
        Size() int64
        Mode() FileMode
        ModTime() time.Time
    }
  expected: negative
  rationale: File name, size, mode, and modification time are stable filesystem concepts consumers legitimately need.
- id: information-leakage-negative-difficult-python
  language: Python
  code: |
    class QueryPlan:
        def estimated_cost(self) -> float: ...
        def referenced_indexes(self) -> tuple[str, ...]: ...
        def explain(self) -> str: ...
  expected: negative
  rationale: In a database diagnostics API, query planning and index information are the product being exposed.
- id: information-leakage-negative-difficult-typescript
  language: TypeScript
  code: |
    export interface PluginContext {
      apiVersion: "2";
      logger: Logger;
      registerCommand(command: Command): Disposable;
    }
  expected: negative
  rationale: These are deliberate, versioned plugin capabilities and avoid exposing the host's private object graph.
- id: information-leakage-negative-difficult-csharp
  language: C#
  code: |
    public sealed record UploadReceipt(
        Uri Location,
        string ContentHash,
        long Length);
  expected: negative
  rationale: Location, integrity hash, and length are provider-neutral results useful to consumers of the upload contract.
- id: information-leakage-negative-difficult-java
  language: Java
  code: |
    sealed interface ParseResult {
        record Success(Document document) implements ParseResult {}
        record Failure(int line, int column, String message) implements ParseResult {}
    }
  expected: negative
  rationale: Source location and diagnostic text are stable parser outcomes, not details of the parsing algorithm.
