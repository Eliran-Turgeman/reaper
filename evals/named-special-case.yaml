- id: named-special-case-subtle-go
  language: Go
  task: Add generic middleware for recording request metrics.
  code: |
    func Metrics(next http.Handler) http.Handler {
        return http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {
            label := r.URL.Path
            if strings.HasPrefix(r.URL.Path, "/enterprise/acme/") {
                label = "acme-priority"
            }
            requests.WithLabelValues(label).Inc()
            next.ServeHTTP(w, r)
        })
    }
  expected: positive
  rationale: A named tenant's reporting policy is coupled to general metrics middleware.
- id: named-special-case-subtle-python
  language: Python
  task: Add a reusable record deduplication function.
  code: |
    def deduplicate(records, key):
        seen = set()
        for record in records:
            identity = key(record)
            if record.get("source") == "legacy-payroll":
                identity = identity.removeprefix("EMP-")
            if identity not in seen:
                seen.add(identity)
                yield record
  expected: positive
  rationale: Legacy payroll normalization is specific ingestion policy inside a general deduplication algorithm.
