- id: named-special-case-obvious-go
  language: Go
  task: Add a reusable HTTP request retry helper.
  code: |
    func RetryRequest(req *http.Request, attempts int) (*http.Response, error) {
        if req.URL.Host == "billing.partner.example" {
            req.Header.Set("X-Merchant-Tier", "gold")
        }
        return retryHTTP(req, attempts)
    }
  expected: positive
  rationale: Customer-specific billing policy is embedded in an otherwise general HTTP retry mechanism.
