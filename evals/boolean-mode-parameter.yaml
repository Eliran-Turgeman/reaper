- id: boolean-mode-parameter-positive-go-1
  language: Go
  task: Add a method that writes a report.
  code: |
    func WriteReport(report Report, compact bool) error {
        if compact {
            return writeSummary(report)
        }
        return writeDetailed(report)
    }
  expected: positive
  rationale: The boolean makes callers select between two different writing operations.
- id: boolean-mode-parameter-positive-python-1
  language: Python
  task: Add a user loading operation.
  code: |
    def load_user(user_id: str, from_cache: bool):
        if from_cache:
            return cache.get(user_id)
        return database.load(user_id)
  expected: positive
  rationale: The caller is asked to choose the operation's internal data source.
- id: boolean-mode-parameter-positive-typescript-1
  language: TypeScript
  task: Send a notification.
  code: |
    async function notify(message: Message, asyncMode: boolean) {
      return asyncMode ? queue.publish(message) : sender.send(message);
    }
  expected: positive
  rationale: One boolean selects two substantially different execution mechanisms.
- id: boolean-mode-parameter-positive-csharp-1
  language: C#
  task: Add an operation that processes an order.
  code: |
    public Task ProcessAsync(Order order, bool validateOnly)
    {
        return validateOnly ? ValidateAsync(order) : CommitAsync(order);
    }
  expected: positive
  rationale: Validation and committing are distinct operations hidden behind a mode flag.
- id: boolean-mode-parameter-positive-java-1
  language: Java
  task: Export the supplied records.
  code: |
    void export(List<Record> records, boolean compressed) {
        if (compressed) writeZip(records);
        else writeCsv(records);
    }
  expected: positive
  rationale: The boolean chooses between different export formats and operations.
- id: boolean-mode-parameter-positive-go-2
  language: Go
  task: Add a delete method.
  code: |
    func Delete(id string, hard bool) error {
        if hard {
            return permanentlyRemove(id)
        }
        return markDeleted(id)
    }
  expected: positive
  rationale: Permanent removal and soft deletion should be explicit operations rather than a boolean mode.
- id: boolean-mode-parameter-positive-python-2
  language: Python
  task: Refresh account data.
  code: |
    def refresh(account_id: str, force: bool):
        if force:
            invalidate_cache(account_id)
        return fetch(account_id)
  expected: positive
  rationale: The flag requires callers to control cache invalidation mechanics.
- id: boolean-mode-parameter-positive-typescript-2
  language: TypeScript
  task: Open a document.
  code: |
    function openDocument(path: string, editable: boolean) {
      return editable ? editor.open(path) : viewer.open(path);
    }
  expected: positive
