- id: boolean-mode-parameter-positive-csharp-2
  language: C#
  task: Run the import.
  code: |
    public Result Import(Stream input, bool dryRun)
    {
        return dryRun ? Simulate(input) : Persist(input);
    }
  expected: positive
  rationale: Simulation and persistence are separate operation modes.
- id: boolean-mode-parameter-positive-java-2
  language: Java
  task: Resolve an account.
  code: |
    Account resolve(String id, boolean createIfMissing) {
        Account account = find(id);
        return account == null && createIfMissing ? create(id) : account;
    }
  expected: positive
  rationale: Lookup and lookup-or-create are different contracts hidden behind a boolean.
