- id: unchanged-argument-forwarder-negative-obvious-csharp
  language: C#
  task: Provide one operation that commits an uploaded document.
  code: |
    public async Task<DocumentId> CommitAsync(Stream content, CancellationToken token)
    {
        var checksum = await _hashes.ComputeAsync(content, token);
        content.Position = 0;
        var location = await _blobs.PutAsync(content, token);
        return await _documents.CreateAsync(location, checksum, token);
    }
  expected: negative
  rationale: The method hides a multi-step storage protocol behind a single cohesive operation.
