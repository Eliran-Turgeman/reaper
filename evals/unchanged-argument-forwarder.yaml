- id: unchanged-argument-forwarder-negative-obvious-go
  language: Go
  task: Expose a simple profile operation over two storage calls.
  code: |
    func (s *ProfileService) Rename(ctx context.Context, id UserID, name string) error {
        user, err := s.users.Get(ctx, id)
        if err != nil {
            return err
        }
        user.DisplayName = strings.TrimSpace(name)
        return s.users.Save(ctx, user)
    }
  expected: negative
  rationale: The service owns retrieval, normalization, mutation, and persistence behind one domain operation.
