- id: unchanged-argument-forwarder-obvious-go
  language: Go
  task: Add a service used to save orders.
  code: |
    type OrderService struct {
        repository *OrderRepository
    }

    func (s *OrderService) Save(ctx context.Context, order Order) error {
        return s.repository.Save(ctx, order)
    }
  expected: positive
  rationale: The service repeats the repository operation and arguments without adding policy, translation, or simplification.
