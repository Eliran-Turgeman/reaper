- id: unchanged-argument-forwarder-negative-difficult-java
  language: Java
  code: |
    final class SerializedExecutor implements Executor {
        private final Executor delegate;
        private final Semaphore permit = new Semaphore(1);

        public void execute(Runnable command) {
            delegate.execute(() -> {
                permit.acquireUninterruptibly();
                try { command.run(); } finally { permit.release(); }
            });
        }
    }
  expected: negative
  rationale: Although it delegates execution, the wrapper provides the meaningful guarantee that tasks never overlap.
