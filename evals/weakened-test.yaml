- id: weakened-test-obvious-go
  language: Go
  old_code: |
    if got != 42 {
        t.Fatalf("got %d, want 42", got)
    }
  code: |
    if got == 0 {
        t.Fatal("expected a non-zero result")
    }
  expected: positive
  rationale: The exact behavioral assertion was replaced with a far weaker non-zero check.
- id: weakened-test-obvious-python
  language: Python
  old_code: |
    assert response.status_code == 201
    assert response.json() == {"id": "p-1", "state": "created"}
  code: |
    assert response.ok
  expected: positive
  rationale: The revised test no longer checks the required status or response payload.
- id: weakened-test-obvious-typescript
  language: TypeScript
  old_code: |
    expect(sendEmail).toHaveBeenCalledWith("a@example.com", "Welcome");
  code: |
    expect(sendEmail).toHaveBeenCalled();
  expected: positive
  rationale: Removing argument assertions permits emails to the wrong recipient with the wrong content.
- id: weakened-test-obvious-csharp
  language: C#
  old_code: |
    result.Should().BeEquivalentTo(expected);
  code: |
    result.Should().NotBeNull();
  expected: positive
  rationale: A complete value comparison was reduced to an existence check.
- id: weakened-test-obvious-java
  language: Java
  old_code: |
    assertThrows(InsufficientFundsException.class, () -> account.withdraw(100));
  code: |
    assertDoesNotThrow(() -> account.withdraw(100));
  expected: positive
  rationale: The test now endorses behavior opposite to the original error contract.
- id: weakened-test-subtle-go
  language: Go
  old_code: |
    require.Equal(t, []string{"a", "b", "c"}, got)
  code: |
    require.ElementsMatch(t, []string{"a", "b", "c"}, got)
  expected: positive
  rationale: An order-sensitive result was silently changed to an unordered comparison.
- id: weakened-test-subtle-python
  language: Python
  old_code: |
    with pytest.raises(ParseError, match="line 3: invalid date"):
        parse(source)
  code: |
    with pytest.raises(Exception):
        parse(source)
  expected: positive
  rationale: Accepting any exception can let unrelated crashes satisfy the test.
- id: weakened-test-subtle-typescript
  language: TypeScript
  old_code: |
    expect(total).toBe(19.95);
  code: |
    expect(total).toBeCloseTo(19.95, 0);
  expected: positive
  rationale: Zero decimal digits allow materially incorrect currency values to pass.
- id: weakened-test-subtle-csharp
  language: C#
  old_code: |
    await operation.Should().CompleteWithinAsync(TimeSpan.FromMilliseconds(200));
  code: |
    await operation.Should().CompleteWithinAsync(TimeSpan.FromSeconds(30));
  expected: positive
  rationale: Expanding a performance assertion by two orders of magnitude hides the regression it guarded.
- id: weakened-test-subtle-java
  language: Java
  old_code: |
    verify(repository, times(1)).save(order);
    verifyNoMoreInteractions(repository);
  code: |
    verify(repository, atLeastOnce()).save(any(Order.class));
  expected: positive
  rationale: Count, argument, and unexpected-interaction guarantees were all loosened.
- id: weakened-test-negative-obvious-go
  language: Go
  task: Update the test because map iteration order is intentionally unspecified.
  old_code: |
    require.Equal(t, []string{"blue", "green", "red"}, keys)
  code: |
    require.ElementsMatch(t, []string{"blue", "green", "red"}, keys)
  expected: negative
  rationale: Removing order sensitivity aligns the assertion with the explicit unordered contract.
- id: weakened-test-negative-obvious-python
  language: Python
  task: Replace the removed legacy error text while retaining the public exception contract.
  old_code: |
    with pytest.raises(ValueError, match="legacy parser failed"):
        parse(value)
  code: |
    with pytest.raises(ValueError):
        parse(value)
  expected: negative
  rationale: The exception type is the contract and the deleted implementation-specific message is not.
- id: weakened-test-negative-obvious-typescript
  language: TypeScript
  task: Make the timestamp test tolerate normal clock advancement.
  old_code: |
    expect(record.createdAt).toEqual(new Date());
  code: |
    expect(record.createdAt.getTime()).toBeGreaterThanOrEqual(startedAt);
    expect(record.createdAt.getTime()).toBeLessThanOrEqual(Date.now());
  expected: negative
  rationale: The bounded range is more correct than equality with a separately sampled clock.
- id: weakened-test-negative-obvious-csharp
  language: C#
  task: Verify generated identifiers without pinning a random value.
  old_code: |
    result.Id.Should().Be("4f63f7f1-fixed-fixture");
  code: |
    Guid.TryParse(result.Id, out _).Should().BeTrue();
  expected: negative
  rationale: The new assertion checks the actual UUID contract and removes dependence on a random fixture value.
- id: weakened-test-negative-obvious-java
  language: Java
  task: Stop depending on JSON object property order.
  old_code: |
    assertEquals("{\"id\":7,\"name\":\"Ada\"}", json);
  code: |
    assertEquals(
        mapper.readTree("{\"id\":7,\"name\":\"Ada\"}"),
        mapper.readTree(json));
  expected: negative
  rationale: Structural JSON equality preserves content checks while correctly ignoring insignificant key order.
- id: weakened-test-negative-difficult-go
  language: Go
  old_code: |
    require.Equal(t, time.Date(2025, 1, 1, 10, 0, 0, 0, time.Local), got)
  code: |
    require.True(t, got.Equal(time.Date(2025, 1, 1, 10, 0, 0, 0, time.UTC)))
  expected: negative
  rationale: Time.Equal checks the same instant and avoids incorrectly requiring identical location metadata.
- id: weakened-test-negative-difficult-python
  language: Python
  old_code: |
    assert mock_calls == [call.fetch(1), call.fetch(2), call.fetch(3)]
  code: |
    assert mock_calls == [
        call.fetch(ANY),
        call.fetch(ANY),
        call.fetch(ANY),
    ]
    assert {c.args[0] for c in mock_calls} == {1, 2, 3}
  expected: negative
  rationale: The test still verifies all arguments and count while allowing documented parallel completion order.
- id: weakened-test-negative-difficult-typescript
  language: TypeScript
  old_code: |
    expect(rendered).toMatchSnapshot();
  code: |
    expect(screen.getByRole("button", { name: "Save" })).toBeEnabled();
    expect(screen.getByLabelText("Title")).toHaveValue("Draft");
  expected: negative
  rationale: Focused semantic assertions can be stronger than a broad brittle snapshot for required behavior.
- id: weakened-test-negative-difficult-csharp
  language: C#
  old_code: |
    serialized.Should().Be("{\"amount\":10.0,\"currency\":\"USD\"}");
  code: |
    JsonNode.Parse(serialized).Should().BeEquivalentTo(
        JsonNode.Parse("{\"currency\":\"USD\",\"amount\":10.00}"));
  expected: negative
  rationale: Structural comparison retains both values while ignoring irrelevant formatting and property order.
- id: weakened-test-negative-difficult-java
  language: Java
  old_code: |
    assertSame(expectedUser, result.user());
  code: |
    assertEquals(expectedUser.id(), result.user().id());
    assertEquals(expectedUser.email(), result.user().email());
  expected: negative
  rationale: Value assertions match the service contract better than requiring the exact in-memory object instance.
