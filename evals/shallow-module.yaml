- id: shallow-module-negative-difficult-typescript
  language: TypeScript
  code: |
    type UserId = string & { readonly userId: unique symbol };

    function userId(raw: string): UserId {
      if (!UUID_PATTERN.test(raw)) throw new InvalidUserId(raw);
      return raw as UserId;
    }
  expected: negative
  rationale: A narrow constructor enforces validation and prevents accidental mixing of identifiers throughout the program.
- id: shallow-module-negative-difficult-csharp
  language: C#
  code: |
