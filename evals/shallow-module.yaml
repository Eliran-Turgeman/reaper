- id: shallow-module-negative-difficult-java
  language: Java
  code: |
    record Percentage(BigDecimal value) {
        Percentage {
            if (value.signum() < 0 || value.compareTo(BigDecimal.ONE) > 0) {
                throw new IllegalArgumentException("percentage outside 0..1");
            }
        }

        BigDecimal applyTo(BigDecimal amount) {
            return amount.multiply(value);
        }
    }
  expected: negative
  rationale: The small value object enforces a useful invariant and prevents raw decimals from being misinterpreted.
