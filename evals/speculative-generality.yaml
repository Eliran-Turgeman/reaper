- id: speculative-generality-negative-difficult-typescript
  language: TypeScript
  code: |
    type EventMap = {
      connected: { peerId: string };
      disconnected: { reason: string };
    };
    function emit<K extends keyof EventMap>(name: K, payload: EventMap[K]): void {
      bus.publish(name, payload);
    }
  expected: negative
  rationale: The generic ties each existing event name to its payload and prevents real type errors; it does not add unsupported events.
