- id: speculative-generality-negative-difficult-java
  language: Java
  code: |
    final class DecoderRegistry {
        private final Map<Byte, MessageDecoder<?>> byType;

        Message decode(ByteBuffer input) {
            return byType.get(input.get()).decode(input);
