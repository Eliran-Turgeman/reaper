- id: speculative-generality-negative-difficult-python
  language: Python
  code: |
    class Transaction(Protocol):
        def commit(self) -> None: ...
        def rollback(self) -> None: ...

    def import_rows(rows: Iterable[Row], tx: Transaction) -> None:
        ...
  expected: negative
