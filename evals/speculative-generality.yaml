- id: speculative-generality-obvious-go
  language: Go
  task: Add a function that formats the one supported invoice type.
  code: |
    type InvoiceFormatter interface {
        Format(Invoice) string
    }
    type DefaultInvoiceFormatter struct{}
    func (DefaultInvoiceFormatter) Format(i Invoice) string { return i.Number }
  expected: positive
  rationale: An interface and implementation pair add indirection despite there being one fixed behavior.
- id: speculative-generality-obvious-python
  language: Python
  task: Read the configured API URL.
  code: |
    class SettingProvider(ABC):
        @abstractmethod
        def api_url(self) -> str: ...

    class EnvironmentSettingProvider(SettingProvider):
        def api_url(self) -> str:
            return os.environ["API_URL"]
  expected: positive
  rationale: The requested environment lookup has been expanded into an unused provider hierarchy.
- id: speculative-generality-obvious-typescript
  language: TypeScript
  task: Parse JSON responses from this endpoint.
  code: |
    type ResponseFormat = "json" | "xml" | "yaml";
    async function parseResponse(
      response: Response,
      format: ResponseFormat = "json",
    ): Promise<unknown> {
      if (format !== "json") throw new Error("Not implemented");
      return response.json();
    }
  expected: positive
  rationale: Unsupported future formats are exposed in the API even though only JSON was requested or implemented.
- id: speculative-generality-obvious-csharp
  language: C#
  task: Send password-reset email through the existing mailer.
  code: |
    public enum ResetDeliveryChannel { Email, Sms, Push }

    public Task SendResetAsync(User user, ResetDeliveryChannel channel = ResetDeliveryChannel.Email)
    {
        if (channel != ResetDeliveryChannel.Email) throw new NotSupportedException();
        return _mailer.SendResetAsync(user.Email);
    }
  expected: positive
  rationale: The enum predicts unrequested channels and makes callers handle options that do not exist.
- id: speculative-generality-obvious-java
  language: Java
  task: Calculate sales tax for the only operating region.
  code: |
    interface TaxStrategy {
        BigDecimal calculate(BigDecimal subtotal);
    }
    final class LocalTaxStrategy implements TaxStrategy {
        public BigDecimal calculate(BigDecimal subtotal) {
            return subtotal.multiply(new BigDecimal("0.07"));
        }
    }
  expected: positive
  rationale: A strategy abstraction is premature when the product has one fixed region and calculation.
- id: speculative-generality-subtle-go
  language: Go
  task: Add a 30-second timeout to the importer.
  code: |
    type ImportOptions struct {
        Timeout time.Duration
        Clock   func() time.Time
        OnRetry func(int)
    }
    opts := ImportOptions{Timeout: 30 * time.Second, Clock: time.Now}
  expected: positive
  rationale: Clock and retry hooks are introduced without consumers to anticipate hypothetical future behavior.
- id: speculative-generality-subtle-python
  language: Python
  task: Normalize usernames to lowercase.
  code: |
    def normalize_username(
        username: str,
        transforms: tuple[Callable[[str], str], ...] = (str.lower,),
    ) -> str:
        for transform in transforms:
            username = transform(username)
        return username
  expected: positive
  rationale: A configurable transformation pipeline needlessly generalizes one required lowercase operation.
- id: speculative-generality-subtle-typescript
  language: TypeScript
  task: Cache product records in memory.
  code: |
    interface CacheBackend<T> {
      get(key: string): T | undefined;
      set(key: string, value: T): void;
    }
    class ProductCache<B extends CacheBackend<Product>> {
      constructor(private readonly backend: B) {}
    }
  expected: positive
  rationale: Backend genericity anticipates replacement stores even though the task specifies an in-memory cache.
- id: speculative-generality-subtle-csharp
  language: C#
  task: Export the report as CSV.
  code: |
    public sealed record ExportOptions(
        string Format = "csv",
        char Delimiter = ',',
        bool IncludeMetadata = false);

    public string Export(Report report, ExportOptions? options = null) =>
        WriteCsv(report, options ?? new());
  expected: positive
  rationale: Format and metadata switches broaden a CSV-only requirement without implemented alternatives.
- id: speculative-generality-subtle-java
  language: Java
  task: Retry this request twice.
  code: |
    record RetryPolicy(
        int attempts,
        Duration initialDelay,
        double multiplier,
        Predicate<Throwable> retryable) {}

    var policy = new RetryPolicy(2, Duration.ZERO, 1.0, error -> true);
  expected: positive
  rationale: A full policy object is invented for a fixed two-attempt requirement with no delay rules.
- id: speculative-generality-negative-obvious-go
  language: Go
  task: Support both S3 and Azure Blob storage selected by deployment configuration.
  code: |
    type ObjectStore interface {
        Put(context.Context, string, io.Reader) error
    }
    func NewObjectStore(cfg Config) ObjectStore {
        if cfg.Provider == "azure" { return NewAzureStore(cfg) }
        return NewS3Store(cfg)
    }
  expected: negative
  rationale: The interface is required by two explicitly supported production providers.
