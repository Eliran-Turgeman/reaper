version: 1

provider: openrouter
model: typesafe/jev-1.13

request_timeout: 30s
concurrency: 4

cache:
  enabled: true

rules:
  narrating-comment:
    enabled: true
    threshold: 0.92
    severity: warning

  unchanged-argument-forwarder:
    enabled: true
    threshold: 0.90
    severity: warning

  ceremonial-abstraction:
    enabled: true
    threshold: 0.90
    severity: warning

  boolean-mode-parameter:
    enabled: true
    threshold: 0.90
    severity: warning

  caller-managed-mechanics:
    enabled: true
    threshold: 0.90
    severity: warning

  implementation-detail-exposure:
    enabled: true
    threshold: 0.91
    severity: warning

  named-special-case:
    enabled: true
    threshold: 0.91
    severity: warning

  unused-extensibility-point:
    enabled: true
    threshold: 0.91
    severity: warning

  silent-failure-fallback:
    enabled: true
    threshold: 0.92
    severity: error

  weakened-test-assertion:
    enabled: true
    threshold: 0.93
    severity: error

  scope-creep:
    enabled: true
    threshold: 0.90
    severity: warning

exclude:
  - vendor/**
  - generated/**
  - dist/**
  - node_modules/**
  - "**/*.lock"
