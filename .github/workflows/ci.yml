name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l cmd internal)"
      - run: go test ./...
      - run: node --test .github/actions/reaper/run.test.cjs
      - run: go vet ./...
      - run: go build ./cmd/reaper
      - name: Race tests
        if: runner.os == 'Linux'
        run: go test -race ./...
      - name: Install checkout using canonical module path
        run: go install github.com/Eliran-Turgeman/reaper/cmd/reaper
      - run: reaper version
